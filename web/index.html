<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Listas, tarefas, camiões e pessoas da equipa de Livre Serviço.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Livre Serviço">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Livre Serviço Companion</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading screen: shown from the first byte, through the app's download
       and startup, until main() calls hideLoader after the first frame. -->
  <style>
    :root { --bg: #ffffff; --fg: #111111; --muted: #6b6b6b; --track: #e0e0e0; --accent: #2e7d32; }
    :root.dark { --bg: #121212; --fg: #e6e6e6; --muted: #9e9e9e; --track: #3a3a3a; --accent: #43a047; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #loader {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 16px; background: var(--bg); color: var(--fg);
      font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
      transition: opacity 250ms ease;
    }
    #loader.gone { opacity: 0; pointer-events: none; }
    #loader img { width: 72px; height: 72px; border-radius: 16px; }
    #loader .name { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; text-align: center; }
    #loader .spinner {
      width: 28px; height: 28px; margin-top: 8px; border-radius: 50%;
      border: 3px solid var(--track); border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    #loader .hint { font-size: 14px; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loader .spinner { animation-duration: 2.5s; } }
  </style>
  <script>
    // The theme chosen in Definições → Aparência (shared_preferences keeps it
    // in localStorage as "flutter.themeMode"); light unless chosen otherwise.
    (function () {
      var mode = 'light';
      try { mode = JSON.parse(localStorage.getItem('flutter.themeMode')) || 'light'; } catch (e) {}
      var dark = mode === 'dark' ||
        (mode === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
    function hideLoader() {
      var el = document.getElementById('loader');
      if (!el) return;
      el.classList.add('gone');
      setTimeout(function () { el.remove(); }, 300);
    }
  </script>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Livre Serviço Companion</div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="hint">A carregar…</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
