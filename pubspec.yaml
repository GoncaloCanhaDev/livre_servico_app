name: livre_servico_app
description: "Livre Serviço Companion - work tracking app."
publish_to: 'none'
version: 0.46.0+106

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.4
  intl: ^0.20.2
  barcode_widget: ^2.0.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5
  share_plus: ^10.1.2
  file_picker: ^8.1.4
  uuid: ^4.5.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/vasilhame.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
