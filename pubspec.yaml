name: livre_servico_app
description: "Livre Serviço Companion - work tracking app."
publish_to: 'none'
version: 0.64.0+160

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.4
  intl: ^0.20.2
  barcode_widget: ^2.0.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  uuid: ^4.5.1
  image_picker: ^1.2.3
  supabase: ^2.16.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
